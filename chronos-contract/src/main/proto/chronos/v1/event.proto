syntax = "proto3";
package chronos.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.chronos.contract.v1";

message ChronosEvent {
  string event_id = 1;
  string event_type = 2;
  int32 schema_version = 3;
  string source_type = 4;
  string source_id = 5;
  optional int64 source_sequence = 6;
  string space_id = 7;
  google.protobuf.Timestamp occurred_at = 8;
  google.protobuf.Timestamp received_at = 9;
  optional string correlation_id = 10;
  optional string causation_id = 11;
  double confidence = 12;
  string payload_json = 20;
}
