spring:
  application:
    name: chronos-server
  datasource:
    url: ${CHRONOS_DB_URL:jdbc:postgresql://localhost:5432/chronos}
    username: ${CHRONOS_DB_USER:chronos}
    password: ${CHRONOS_DB_PASSWORD:chronos}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${CHRONOS_REDIS_HOST:localhost}
      port: ${CHRONOS_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${CHRONOS_KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

server:
  port: ${CHRONOS_HTTP_PORT:8080}

chronos:
  grpc:
    port: ${CHRONOS_GRPC_PORT:9090}
  outbox:
    poll-ms: 250

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
