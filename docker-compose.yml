services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
    ports: ["5432:5432"]
    volumes: [chronos-postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [chronos-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
  chronos-server:
    profiles: ["apps"]
    build: {context: ., dockerfile: Dockerfile}
    environment:
      CHRONOS_DB_URL: jdbc:postgresql://postgres:5432/chronos
      CHRONOS_DB_USER: chronos
      CHRONOS_DB_PASSWORD: chronos
      CHRONOS_REDIS_HOST: redis
      CHRONOS_KAFKA_BOOTSTRAP: kafka:9092
      CHRONOS_HTTP_PORT: 8080
      CHRONOS_GRPC_PORT: 9090
      CHRONOS_DEVICE_LEASE_SECONDS: 15
      CHRONOS_DEVICE_OFFLINE_SECONDS: 25
    ports: ["8080:8080", "9090:9090"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
  chronos-device-gateway:
    profiles: ["apps"]
    build: {context: ., dockerfile: Dockerfile.gateway}
    environment:
      CHRONOS_GATEWAY_CORE_HOST: chronos-server
      CHRONOS_GATEWAY_CORE_GRPC_PORT: 9090
      CHRONOS_GATEWAY_ID: gateway-a
    ports: ["9100:9100"]
    depends_on:
      chronos-server: {condition: service_started}
  chronos-device-gateway-2:
    profiles: ["apps"]
    build: {context: ., dockerfile: Dockerfile.gateway}
    environment:
      CHRONOS_GATEWAY_CORE_HOST: chronos-server
      CHRONOS_GATEWAY_CORE_GRPC_PORT: 9090
      CHRONOS_GATEWAY_ID: gateway-b
      CHRONOS_GATEWAY_TCP_PORT: 9100
    ports: ["9101:9100"]
    depends_on:
      chronos-server: {condition: service_started}
volumes:
  chronos-postgres:
  chronos-redis:
