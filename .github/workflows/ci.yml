name: CHRONOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
      - name: Build and run tests
        run: gradle clean build --no-daemon --stacktrace

  docker-integration:
    name: Device Lifecycle Integration
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Start stack
        run: docker compose --profile apps up -d --build
      - name: Wait for server and gateways
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"' && nc -z 127.0.0.1 9100 && nc -z 127.0.0.1 9101; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Register device
        run: |
          response=$(curl -fsS -X POST http://localhost:8080/api/v1/devices -H 'Content-Type: application/json' -d '{"deviceId":"TEMP-CI-001","spaceId":"LAB-001","deviceType":"TEMPERATURE","protocol":"CHRONOS-TCP","protocolVersion":"1"}')
          secret=$(echo "$response" | jq -r '.secret')
          echo "DEVICE_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Auth, gap and retransmit
        run: |
          python3 tools/device-simulator.py --device TEMP-CI-001 --space LAB-001 --secret "$DEVICE_SECRET" --sequence 1 --count 3 --skip-sequence 2 --split --hold-seconds 30 > simulator-a.log 2>&1 &
          for i in {1..20}; do
            d=$(curl -fsS http://localhost:8080/api/v1/devices/TEMP-CI-001)
            [ "$(echo "$d" | jq -r '.status')" = ONLINE ] && [ "$(echo "$d" | jq -r '.lastSequence')" = 3 ] && exit 0
            sleep 1
          done
          cat simulator-a.log; exit 1
      - name: Reject lease steal
        run: |
          set +e
          python3 tools/device-simulator.py --port 9101 --device TEMP-CI-001 --space LAB-001 --secret "$DEVICE_SECRET" --sequence 4
          rc=$?
          set -e
          test $rc -ne 0
      - name: Replay smoke test
        run: |
          for i in {1..30}; do curl -fsS http://localhost:8080/api/v1/world/LAB-001/current > current.json && break || sleep 1; done
          jq -e '.lastEventSeq > 0' current.json
          at=$(date -u -d '+5 seconds' +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS "http://localhost:8080/api/v1/world/LAB-001/state?at=$at" | jq -e '.lastEventSeq > 0'
      - name: Gateway failover
        run: |
          docker compose kill chronos-device-gateway
          sleep 18
          python3 tools/device-simulator.py --port 9101 --device TEMP-CI-001 --space LAB-001 --secret "$DEVICE_SECRET" --type heartbeat --sequence 4
      - name: Verify offline after disconnect
        run: |
          for i in {1..20}; do [ "$(curl -fsS http://localhost:8080/api/v1/devices/TEMP-CI-001 | jq -r '.status')" = OFFLINE ] && exit 0; sleep 1; done
          exit 1
      - if: failure()
        run: docker compose --profile apps logs --no-color --tail=500
      - if: always()
        run: docker compose --profile apps down -v --remove-orphans
